<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2248"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="470" cy="250" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#2563eb" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e4a8a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0f2c57" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020a1a" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 104h800M0 208h800M0 312h800M0 416h800M160 0v520M320 0v520M480 0v520M640 0v520"/>
  </g>

  <!-- orbits -->
  <g stroke="#93c5fd" stroke-opacity=".3">
    <ellipse cx="490" cy="255" rx="200" ry="200"/>
    <ellipse cx="490" cy="255" rx="140" ry="140" stroke-dasharray="4 8"/>
  </g>

  <!-- links from core to nodes -->
  <g stroke="#818cf8" stroke-width="2.5" stroke-opacity=".8">
    <path d="M490 255L490 70"/>
    <path d="M490 255L680 170"/>
    <path d="M490 255L680 350"/>
    <path d="M490 255L490 440"/>
    <path d="M490 255L330 255"/>
  </g>
  <g fill="#c7d2fe">
    <circle cx="490" cy="150" r="4"/>
    <circle cx="595" cy="208" r="4"/>
    <circle cx="590" cy="302" r="4"/>
    <circle cx="490" cy="355" r="4"/>
  </g>

  <!-- core chip -->
  <circle cx="490" cy="255" r="78" fill="#6366f1" opacity=".55" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <g stroke="#a5b4fc" stroke-width="4" stroke-linecap="round">
      <path d="M460 190v-14M490 190v-14M520 190v-14M460 320v14M490 320v14M520 320v14M425 225h-14M425 255h-14M425 285h-14M555 225h14M555 255h14M555 285h14"/>
    </g>
    <rect x="425" y="190" width="130" height="130" rx="26" fill="url(#core)" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="443" y="208" width="94" height="94" rx="18" fill="#0b2248" fill-opacity=".35" stroke="#e0e7ff" stroke-opacity=".5"/>
    <text x="490" y="272" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">AI</text>
  </g>

  <!-- node: document -->
  <g filter="url(#shadow)">
    <circle cx="490" cy="62" r="34" fill="#0f2c57" stroke="#818cf8" stroke-width="2"/>
    <path d="M478 46h18l8 8v24h-26z" fill="#e0e7ff"/>
    <path d="M484 60h14M484 66h14M484 72h9" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- node: database -->
  <g filter="url(#shadow)">
    <circle cx="690" cy="165" r="34" fill="#0f2c57" stroke="#818cf8" stroke-width="2"/>
    <path d="M674 155v20c0 4 7 8 16 8s16-4 16-8v-20" fill="#60a5fa"/>
    <ellipse cx="690" cy="155" rx="16" ry="6" fill="#bfdbfe"/>
    <path d="M674 165c0 4 7 8 16 8s16-4 16-8" stroke="#0b2248" stroke-width="2"/>
  </g>
  <!-- node: gear/tools -->
  <g filter="url(#shadow)">
    <circle cx="690" cy="350" r="34" fill="#0f2c57" stroke="#818cf8" stroke-width="2"/>
    <circle cx="690" cy="350" r="9" stroke="#fbbf24" stroke-width="4"/>
    <path d="M690 331v6M690 363v6M671 350h6M703 350h6M677 337l4 4M699 359l4 4M677 363l4-4M699 341l4-4" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- node: chart -->
  <g filter="url(#shadow)">
    <circle cx="490" cy="448" r="34" fill="#0f2c57" stroke="#818cf8" stroke-width="2"/>
    <path d="M474 462h32" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="477" y="446" width="6" height="12" rx="2" fill="#34d399"/>
    <rect x="487" y="438" width="6" height="20" rx="2" fill="#34d399"/>
    <rect x="497" y="430" width="6" height="28" rx="2" fill="#34d399"/>
  </g>

  <!-- chat panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="290" height="300" rx="20" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".45"/>
    <circle cx="70" cy="140" r="12" fill="url(#core)"/>
    <text x="70" y="145" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">AI</text>
    <rect x="90" y="134" width="90" height="8" rx="4" fill="#ffffff" fill-opacity=".85"/>
    <circle cx="306" cy="140" r="4" fill="#34d399"/>
    <path d="M40 162h290" stroke="#93c5fd" stroke-opacity=".2"/>

    <!-- user bubble -->
    <rect x="140" y="180" width="170" height="46" rx="14" fill="#3b82f6"/>
    <rect x="154" y="194" width="130" height="6" rx="3" fill="#ffffff"/>
    <rect x="154" y="208" width="90" height="6" rx="3" fill="#ffffff" fill-opacity=".8"/>
    <!-- ai bubble -->
    <rect x="60" y="240" width="210" height="88" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#a5b4fc" stroke-opacity=".4"/>
    <rect x="74" y="254" width="150" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="74" y="268" width="176" height="6" rx="3" fill="#e0e7ff" fill-opacity=".7"/>
    <rect x="74" y="282" width="120" height="6" rx="3" fill="#e0e7ff" fill-opacity=".7"/>
    <rect x="74" y="298" width="64" height="18" rx="9" fill="#6366f1" fill-opacity=".55"/>
    <rect x="144" y="298" width="64" height="18" rx="9" fill="#6366f1" fill-opacity=".55"/>
    <!-- typing -->
    <rect x="60" y="342" width="62" height="28" rx="14" fill="#ffffff" fill-opacity=".1"/>
    <circle cx="78" cy="356" r="4" fill="#c7d2fe"/>
    <circle cx="91" cy="356" r="4" fill="#c7d2fe" fill-opacity=".7"/>
    <circle cx="104" cy="356" r="4" fill="#c7d2fe" fill-opacity=".45"/>
    <!-- input -->
    <rect x="56" y="380" width="258" height="18" rx="9" fill="#071631" fill-opacity=".7"/>
    <circle cx="302" cy="389" r="6" fill="#3b82f6"/>
  </g>

  <g fill="#c7d2fe">
    <circle cx="370" cy="80" r="3"/>
    <circle cx="760" cy="260" r="3"/>
    <circle cx="380" cy="470" r="2"/>
    <circle cx="740" cy="470" r="2"/>
  </g>
</svg>
