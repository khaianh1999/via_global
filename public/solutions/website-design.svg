<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2248"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="400" cy="250" r="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e4a8a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0f2c57" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="heroBlock" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a1a" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 104h800M0 208h800M0 312h800M0 416h800M160 0v520M320 0v520M480 0v520M640 0v520"/>
  </g>

  <!-- platform -->
  <ellipse cx="400" cy="452" rx="300" ry="34" fill="#3b82f6" opacity=".35" filter="url(#glow)"/>
  <rect x="120" y="430" width="560" height="26" rx="13" fill="#123b72" stroke="#60a5fa" stroke-opacity=".7"/>

  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="130" y="70" width="460" height="340" rx="18" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".45"/>
    <path d="M130 88a18 18 0 0 1 18-18h424a18 18 0 0 1 18 18v20H130z" fill="#0b2248"/>
    <circle cx="154" cy="90" r="5" fill="#f87171"/>
    <circle cx="172" cy="90" r="5" fill="#fbbf24"/>
    <circle cx="190" cy="90" r="5" fill="#34d399"/>
    <rect x="220" y="82" width="250" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/>
    <path d="M232 90h6" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <rect x="246" y="87" width="120" height="6" rx="3" fill="#93c5fd" fill-opacity=".45"/>

    <!-- nav -->
    <rect x="152" y="124" width="54" height="12" rx="6" fill="#ffffff" fill-opacity=".9"/>
    <rect x="380" y="127" width="34" height="6" rx="3" fill="#bfdbfe" fill-opacity=".5"/>
    <rect x="424" y="127" width="34" height="6" rx="3" fill="#bfdbfe" fill-opacity=".5"/>
    <rect x="468" y="127" width="34" height="6" rx="3" fill="#bfdbfe" fill-opacity=".5"/>
    <rect x="514" y="121" width="58" height="18" rx="9" fill="#3b82f6"/>

    <!-- hero -->
    <rect x="152" y="152" width="420" height="120" rx="12" fill="url(#heroBlock)"/>
    <rect x="172" y="174" width="160" height="14" rx="7" fill="#ffffff"/>
    <rect x="172" y="196" width="120" height="14" rx="7" fill="#ffffff" fill-opacity=".85"/>
    <rect x="172" y="222" width="150" height="6" rx="3" fill="#dbeafe" fill-opacity=".7"/>
    <rect x="172" y="234" width="130" height="6" rx="3" fill="#dbeafe" fill-opacity=".7"/>
    <rect x="172" y="248" width="64" height="14" rx="7" fill="#ffffff"/>
    <!-- hero art: mountains -->
    <rect x="378" y="164" width="178" height="96" rx="10" fill="url(#sky)"/>
    <circle cx="520" cy="190" r="12" fill="#fde68a"/>
    <path d="M378 252l46-48 30 30 22-20 40 38v8H378z" fill="#0f2c57" fill-opacity=".85"/>
    <path d="M440 252l36-34 44 34z" fill="#1e3a8a"/>

    <!-- cards -->
    <g>
      <rect x="152" y="288" width="130" height="102" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#93c5fd" stroke-opacity=".25"/>
      <rect x="166" y="302" width="28" height="28" rx="8" fill="#3b82f6" fill-opacity=".85"/>
      <rect x="166" y="342" width="90" height="7" rx="3.5" fill="#ffffff" fill-opacity=".8"/>
      <rect x="166" y="356" width="100" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
      <rect x="166" y="366" width="80" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
    </g>
    <g>
      <rect x="297" y="288" width="130" height="102" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#93c5fd" stroke-opacity=".25"/>
      <rect x="311" y="302" width="28" height="28" rx="8" fill="#60a5fa" fill-opacity=".85"/>
      <rect x="311" y="342" width="90" height="7" rx="3.5" fill="#ffffff" fill-opacity=".8"/>
      <rect x="311" y="356" width="100" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
      <rect x="311" y="366" width="70" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
    </g>
    <g>
      <rect x="442" y="288" width="130" height="102" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#93c5fd" stroke-opacity=".25"/>
      <rect x="456" y="302" width="28" height="28" rx="8" fill="#93c5fd" fill-opacity=".85"/>
      <rect x="456" y="342" width="90" height="7" rx="3.5" fill="#ffffff" fill-opacity=".8"/>
      <rect x="456" y="356" width="100" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
      <rect x="456" y="366" width="84" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
    </g>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="560" y="170" width="136" height="252" rx="22" fill="#0b2248" stroke="#93c5fd" stroke-opacity=".6" stroke-width="2"/>
    <rect x="570" y="182" width="116" height="228" rx="14" fill="url(#glass)"/>
    <rect x="608" y="188" width="40" height="6" rx="3" fill="#020a1a"/>
    <rect x="580" y="204" width="34" height="8" rx="4" fill="#ffffff" fill-opacity=".9"/>
    <path d="M664 205h12M664 209h12" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
    <rect x="580" y="222" width="96" height="74" rx="9" fill="url(#heroBlock)"/>
    <rect x="590" y="236" width="60" height="8" rx="4" fill="#ffffff"/>
    <rect x="590" y="250" width="44" height="8" rx="4" fill="#ffffff" fill-opacity=".85"/>
    <rect x="590" y="272" width="34" height="12" rx="6" fill="#ffffff"/>
    <rect x="580" y="306" width="96" height="40" rx="8" fill="#ffffff" fill-opacity=".08"/>
    <rect x="590" y="316" width="20" height="20" rx="6" fill="#3b82f6"/>
    <rect x="618" y="318" width="48" height="6" rx="3" fill="#ffffff" fill-opacity=".8"/>
    <rect x="618" y="330" width="36" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
    <rect x="580" y="354" width="96" height="40" rx="8" fill="#ffffff" fill-opacity=".08"/>
    <rect x="590" y="364" width="20" height="20" rx="6" fill="#60a5fa"/>
    <rect x="618" y="366" width="48" height="6" rx="3" fill="#ffffff" fill-opacity=".8"/>
    <rect x="618" y="378" width="30" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".45"/>
  </g>

  <!-- SEO gauge -->
  <g filter="url(#shadow)">
    <rect x="44" y="196" width="122" height="122" rx="20" fill="#0f2c57" fill-opacity=".92" stroke="#60a5fa" stroke-opacity=".6"/>
    <circle cx="105" cy="250" r="32" stroke="#ffffff" stroke-opacity=".12" stroke-width="8"/>
    <path d="M105 218a32 32 0 1 1-30.4 22.1" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <text x="105" y="257" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">98</text>
    <text x="105" y="303" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">SEO</text>
  </g>

  <!-- speed chip -->
  <g filter="url(#shadow)">
    <rect x="600" y="70" width="150" height="54" rx="27" fill="#0f2c57" fill-opacity=".95" stroke="#60a5fa" stroke-opacity=".6"/>
    <circle cx="628" cy="97" r="17" fill="#fbbf24"/>
    <path d="M631 85l-10 14h8l-3 10 10-14h-8z" fill="#0b2248"/>
    <text x="654" y="94" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.8s</text>
    <text x="654" y="110" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1">LOAD TIME</text>
  </g>

  <!-- sparkles -->
  <g fill="#93c5fd">
    <circle cx="90" cy="110" r="3"/>
    <circle cx="730" cy="300" r="3"/>
    <circle cx="742" cy="420" r="2"/>
    <circle cx="60" cy="400" r="2"/>
  </g>
</svg>
