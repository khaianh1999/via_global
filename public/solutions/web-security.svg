<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2248"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="400" cy="250" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#2563eb" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e4a8a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0f2c57" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020a1a" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 104h800M0 208h800M0 312h800M0 416h800M160 0v520M320 0v520M480 0v520M640 0v520"/>
  </g>

  <!-- rings -->
  <g stroke="#60a5fa">
    <circle cx="400" cy="250" r="190" stroke-opacity=".18"/>
    <circle cx="400" cy="250" r="150" stroke-opacity=".3" stroke-dasharray="3 9"/>
    <circle cx="400" cy="250" r="112" stroke-opacity=".45"/>
  </g>

  <!-- blocked threats -->
  <g>
    <path d="M110 120l90 70" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="104" cy="114" r="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <path d="M98 108l12 12M110 108l-12 12" stroke="#fecaca" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M90 360l110-40" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="82" cy="363" r="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <path d="M76 357l12 12M88 357l-12 12" stroke="#fecaca" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- firewall -->
  <g filter="url(#shadow)">
    <g fill="#c2410c" stroke="#fdba74" stroke-opacity=".5">
      <rect x="196" y="160" width="40" height="22" rx="3"/>
      <rect x="196" y="186" width="18" height="22" rx="3"/>
      <rect x="218" y="186" width="18" height="22" rx="3"/>
      <rect x="196" y="212" width="40" height="22" rx="3"/>
      <rect x="196" y="238" width="18" height="22" rx="3"/>
      <rect x="218" y="238" width="18" height="22" rx="3"/>
      <rect x="196" y="264" width="40" height="22" rx="3"/>
      <rect x="196" y="290" width="18" height="22" rx="3"/>
      <rect x="218" y="290" width="18" height="22" rx="3"/>
      <rect x="196" y="316" width="40" height="22" rx="3"/>
    </g>
    <path d="M216 146c-8 6-10 14-2 18 2-6 8-6 6-12 4 4 6 10 2 14" fill="#fbbf24"/>
  </g>

  <!-- shield -->
  <circle cx="400" cy="250" r="90" fill="#10b981" opacity=".35" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <path d="M400 130l92 32v74c0 62-40 104-92 126-52-22-92-64-92-126v-74z" fill="url(#shield)" stroke="#bfdbfe" stroke-width="3"/>
    <path d="M400 152l72 25v60c0 48-31 82-72 100-41-18-72-52-72-100v-60z" fill="#0b2248" fill-opacity=".35"/>
    <path d="M362 248l26 26 50-54" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lock badge -->
  <g filter="url(#shadow)">
    <rect x="470" y="96" width="132" height="48" rx="24" fill="#0f2c57" fill-opacity=".96" stroke="#34d399" stroke-opacity=".7"/>
    <rect x="488" y="116" width="20" height="16" rx="3" fill="#34d399"/>
    <path d="M492 116v-5a6 6 0 0 1 12 0v5" stroke="#34d399" stroke-width="3"/>
    <text x="518" y="127" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">HTTPS</text>
  </g>

  <!-- server -->
  <g filter="url(#shadow)">
    <rect x="580" y="200" width="150" height="46" rx="10" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".5"/>
    <rect x="580" y="252" width="150" height="46" rx="10" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".5"/>
    <rect x="580" y="304" width="150" height="46" rx="10" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".5"/>
    <g fill="#34d399">
      <circle cx="600" cy="223" r="5"/>
      <circle cx="600" cy="275" r="5"/>
      <circle cx="600" cy="327" r="5"/>
    </g>
    <g stroke="#93c5fd" stroke-opacity=".6" stroke-width="4" stroke-linecap="round">
      <path d="M660 223h52M660 275h52M660 327h52"/>
    </g>
  </g>
  <path d="M492 250h88" stroke="#34d399" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- log panel -->
  <g filter="url(#shadow)">
    <rect x="270" y="400" width="300" height="84" rx="14" fill="#071631" fill-opacity=".95" stroke="#60a5fa" stroke-opacity=".5"/>
    <g font-family="Consolas, monospace" font-size="12">
      <text x="288" y="424" fill="#34d399">✓ backup  02:00  done</text>
      <text x="288" y="444" fill="#93c5fd">✓ waf     rules  active</text>
      <text x="288" y="464" fill="#fbbf24">! blocked 142 requests</text>
    </g>
  </g>

  <g fill="#93c5fd">
    <circle cx="660" cy="80" r="3"/>
    <circle cx="740" cy="420" r="2"/>
    <circle cx="140" cy="460" r="2"/>
  </g>
</svg>
