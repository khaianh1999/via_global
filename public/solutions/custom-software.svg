<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2248"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="380" cy="240" r="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e4a8a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0f2c57" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#34d399" stop-opacity=".45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1d4ed8"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a1a" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 104h800M0 208h800M0 312h800M0 416h800M160 0v520M320 0v520M480 0v520M640 0v520"/>
  </g>

  <ellipse cx="380" cy="456" rx="290" ry="30" fill="#3b82f6" opacity=".3" filter="url(#glow)"/>

  <!-- connectors -->
  <g stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 6" stroke-opacity=".8">
    <path d="M560 300c40 0 60 30 92 30"/>
    <path d="M560 180c40 0 60-40 96-40"/>
  </g>

  <!-- dashboard window -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="490" height="350" rx="18" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".45"/>
    <!-- sidebar -->
    <path d="M70 88a18 18 0 0 1 18-18h82v350H88a18 18 0 0 1-18-18z" fill="#0b2248"/>
    <rect x="88" y="90" width="64" height="12" rx="6" fill="#ffffff" fill-opacity=".9"/>
    <rect x="88" y="128" width="64" height="20" rx="8" fill="#3b82f6"/>
    <rect x="88" y="160" width="56" height="8" rx="4" fill="#bfdbfe" fill-opacity=".4"/>
    <rect x="88" y="182" width="48" height="8" rx="4" fill="#bfdbfe" fill-opacity=".4"/>
    <rect x="88" y="204" width="58" height="8" rx="4" fill="#bfdbfe" fill-opacity=".4"/>
    <rect x="88" y="226" width="44" height="8" rx="4" fill="#bfdbfe" fill-opacity=".4"/>
    <circle cx="102" cy="392" r="12" fill="#60a5fa"/>
    <rect x="120" y="388" width="36" height="8" rx="4" fill="#bfdbfe" fill-opacity=".5"/>

    <!-- KPI tiles -->
    <rect x="190" y="90" width="110" height="64" rx="12" fill="#ffffff" fill-opacity=".08"/>
    <rect x="204" y="104" width="44" height="6" rx="3" fill="#bfdbfe" fill-opacity=".55"/>
    <text x="204" y="138" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1.284</text>
    <rect x="312" y="90" width="110" height="64" rx="12" fill="#ffffff" fill-opacity=".08"/>
    <rect x="326" y="104" width="44" height="6" rx="3" fill="#bfdbfe" fill-opacity=".55"/>
    <text x="326" y="138" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">+32%</text>
    <rect x="434" y="90" width="110" height="64" rx="12" fill="#3b82f6"/>
    <rect x="448" y="104" width="44" height="6" rx="3" fill="#ffffff" fill-opacity=".7"/>
    <text x="448" y="138" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">98,6%</text>

    <!-- bar chart -->
    <rect x="190" y="168" width="232" height="140" rx="12" fill="#ffffff" fill-opacity=".06"/>
    <g fill="url(#bar)">
      <rect x="210" y="246" width="18" height="46" rx="5"/>
      <rect x="240" y="226" width="18" height="66" rx="5"/>
      <rect x="270" y="236" width="18" height="56" rx="5"/>
      <rect x="300" y="206" width="18" height="86" rx="5"/>
      <rect x="330" y="216" width="18" height="76" rx="5"/>
      <rect x="360" y="190" width="18" height="102" rx="5"/>
      <rect x="390" y="200" width="18" height="92" rx="5"/>
    </g>
    <rect x="210" y="180" width="70" height="6" rx="3" fill="#ffffff" fill-opacity=".7"/>

    <!-- line chart -->
    <rect x="434" y="168" width="110" height="140" rx="12" fill="#ffffff" fill-opacity=".06"/>
    <path d="M446 272l18-14 18 8 18-26 18 6 16-24v70h-88z" fill="url(#area)"/>
    <path d="M446 272l18-14 18 8 18-26 18 6 16-24" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="448" y="180" width="50" height="6" rx="3" fill="#ffffff" fill-opacity=".7"/>

    <!-- table -->
    <rect x="190" y="322" width="354" height="82" rx="12" fill="#ffffff" fill-opacity=".06"/>
    <g>
      <circle cx="210" cy="342" r="6" fill="#34d399"/>
      <rect x="224" y="339" width="110" height="6" rx="3" fill="#ffffff" fill-opacity=".7"/>
      <rect x="380" y="339" width="60" height="6" rx="3" fill="#bfdbfe" fill-opacity=".4"/>
      <rect x="480" y="335" width="48" height="14" rx="7" fill="#34d399" fill-opacity=".25"/>
      <circle cx="210" cy="364" r="6" fill="#fbbf24"/>
      <rect x="224" y="361" width="90" height="6" rx="3" fill="#ffffff" fill-opacity=".7"/>
      <rect x="380" y="361" width="72" height="6" rx="3" fill="#bfdbfe" fill-opacity=".4"/>
      <rect x="480" y="357" width="48" height="14" rx="7" fill="#fbbf24" fill-opacity=".25"/>
      <circle cx="210" cy="386" r="6" fill="#60a5fa"/>
      <rect x="224" y="383" width="120" height="6" rx="3" fill="#ffffff" fill-opacity=".7"/>
      <rect x="380" y="383" width="50" height="6" rx="3" fill="#bfdbfe" fill-opacity=".4"/>
      <rect x="480" y="379" width="48" height="14" rx="7" fill="#60a5fa" fill-opacity=".25"/>
    </g>
  </g>

  <!-- code panel -->
  <g filter="url(#shadow)">
    <rect x="600" y="70" width="170" height="150" rx="16" fill="#071631" fill-opacity=".96" stroke="#60a5fa" stroke-opacity=".6"/>
    <text x="616" y="98" fill="#60a5fa" font-family="Consolas, monospace" font-size="16" font-weight="700">&lt;/&gt;</text>
    <circle cx="742" cy="92" r="4" fill="#34d399"/>
    <g stroke-width="6" stroke-linecap="round">
      <path d="M616 120h36" stroke="#c084fc"/>
      <path d="M660 120h60" stroke="#93c5fd"/>
      <path d="M630 140h28" stroke="#fbbf24"/>
      <path d="M666 140h70" stroke="#e2e8f0" stroke-opacity=".6"/>
      <path d="M630 160h52" stroke="#34d399"/>
      <path d="M690 160h30" stroke="#93c5fd"/>
      <path d="M644 180h70" stroke="#e2e8f0" stroke-opacity=".6"/>
      <path d="M616 200h20" stroke="#c084fc"/>
    </g>
  </g>

  <!-- database -->
  <g filter="url(#shadow)">
    <path d="M660 290v86c0 12 22 22 50 22s50-10 50-22v-86z" fill="url(#db)"/>
    <ellipse cx="710" cy="290" rx="50" ry="16" fill="#93c5fd"/>
    <path d="M660 318c0 12 22 22 50 22s50-10 50-22M660 348c0 12 22 22 50 22s50-10 50-22" stroke="#bfdbfe" stroke-opacity=".7" stroke-width="2"/>
    <circle cx="676" cy="336" r="3" fill="#34d399"/>
    <circle cx="676" cy="366" r="3" fill="#34d399"/>
  </g>

  <!-- gear -->
  <g transform="translate(640 455)" opacity=".9">
    <circle r="16" stroke="#60a5fa" stroke-width="5"/>
    <path d="M0-26v8M0 18v8M-26 0h8M18 0h8M-18-18l6 6M12 12l6 6M-18 18l6-6M12-12l6-6" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="40" cy="120" r="3"/>
    <circle cx="36" cy="380" r="2"/>
    <circle cx="590" cy="470" r="2"/>
  </g>
</svg>
