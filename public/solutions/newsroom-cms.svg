<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2248"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="360" cy="250" r="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e4a8a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0f2c57" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fdba74"/>
      <stop offset=".55" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a1a" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 104h800M0 208h800M0 312h800M0 416h800M160 0v520M320 0v520M480 0v520M640 0v520"/>
  </g>
  <ellipse cx="360" cy="460" rx="280" ry="28" fill="#3b82f6" opacity=".3" filter="url(#glow)"/>

  <!-- editor window -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="500" height="380" rx="18" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".45"/>
    <path d="M60 78a18 18 0 0 1 18-18h464a18 18 0 0 1 18 18v30H60z" fill="#0b2248"/>
    <!-- toolbar -->
    <text x="82" y="90" fill="#ffffff" font-family="Georgia, serif" font-size="16" font-weight="700">B</text>
    <text x="104" y="90" fill="#ffffff" font-family="Georgia, serif" font-size="16" font-style="italic">I</text>
    <path d="M124 92h12" stroke="#ffffff" stroke-width="2"/>
    <text x="122" y="90" fill="#ffffff" font-family="Georgia, serif" font-size="16">U</text>
    <path d="M152 76v20" stroke="#93c5fd" stroke-opacity=".3"/>
    <rect x="164" y="78" width="20" height="16" rx="3" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="170" cy="84" r="2" fill="#bfdbfe"/>
    <path d="M196 80l12 6-12 6z" fill="#bfdbfe"/>
    <path d="M220 80h18M220 86h18M220 92h12" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
    <rect x="460" y="74" width="84" height="22" rx="11" fill="#3b82f6"/>
    <rect x="476" y="82" width="52" height="6" rx="3" fill="#ffffff"/>

    <!-- article -->
    <rect x="84" y="128" width="70" height="16" rx="8" fill="#ef4444" fill-opacity=".85"/>
    <rect x="94" y="133" width="50" height="6" rx="3" fill="#ffffff"/>
    <rect x="84" y="156" width="420" height="16" rx="8" fill="#ffffff"/>
    <rect x="84" y="180" width="300" height="16" rx="8" fill="#ffffff"/>
    <circle cx="94" cy="214" r="10" fill="#60a5fa"/>
    <rect x="112" y="210" width="80" height="7" rx="3.5" fill="#bfdbfe" fill-opacity=".6"/>
    <rect x="200" y="210" width="50" height="7" rx="3.5" fill="#bfdbfe" fill-opacity=".35"/>

    <rect x="84" y="236" width="452" height="120" rx="12" fill="url(#photo)"/>
    <circle cx="470" cy="270" r="16" fill="#fef3c7"/>
    <path d="M84 340l80-60 50 38 46-30 90 58 70-44 116 50v4a12 12 0 0 1-12 12H96a12 12 0 0 1-12-12z" fill="#1e1b4b" fill-opacity=".7"/>

    <rect x="84" y="372" width="452" height="7" rx="3.5" fill="#e2e8f0" fill-opacity=".55"/>
    <rect x="84" y="388" width="430" height="7" rx="3.5" fill="#e2e8f0" fill-opacity=".55"/>
    <rect x="84" y="404" width="320" height="7" rx="3.5" fill="#e2e8f0" fill-opacity=".55"/>
    <path d="M410 400v16" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <!-- workflow panel -->
  <g filter="url(#shadow)">
    <rect x="590" y="90" width="170" height="250" rx="18" fill="#0f2c57" fill-opacity=".96" stroke="#60a5fa" stroke-opacity=".55"/>
    <rect x="608" y="110" width="80" height="8" rx="4" fill="#ffffff" fill-opacity=".9"/>
    <path d="M622 160v110" stroke="#93c5fd" stroke-opacity=".35" stroke-width="2"/>

    <circle cx="622" cy="160" r="12" fill="#34d399"/>
    <path d="M616 160l4 4 8-8" stroke="#0b2248" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="644" y="150" width="54" height="7" rx="3.5" fill="#ffffff" fill-opacity=".85"/>
    <rect x="644" y="163" width="80" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".4"/>

    <circle cx="622" cy="215" r="12" fill="#34d399"/>
    <path d="M616 215l4 4 8-8" stroke="#0b2248" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="644" y="205" width="64" height="7" rx="3.5" fill="#ffffff" fill-opacity=".85"/>
    <rect x="644" y="218" width="70" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".4"/>

    <circle cx="622" cy="270" r="12" fill="#fbbf24"/>
    <circle cx="622" cy="270" r="4" fill="#0b2248"/>
    <rect x="644" y="260" width="58" height="7" rx="3.5" fill="#ffffff" fill-opacity=".85"/>
    <rect x="644" y="273" width="76" height="5" rx="2.5" fill="#bfdbfe" fill-opacity=".4"/>

    <rect x="608" y="300" width="134" height="26" rx="13" fill="#3b82f6"/>
    <rect x="640" y="310" width="70" height="6" rx="3" fill="#ffffff"/>
  </g>

  <!-- team avatars -->
  <g filter="url(#shadow)">
    <rect x="590" y="370" width="170" height="64" rx="32" fill="#0f2c57" fill-opacity=".96" stroke="#60a5fa" stroke-opacity=".55"/>
    <circle cx="624" cy="402" r="18" fill="#f472b6" stroke="#0f2c57" stroke-width="3"/>
    <circle cx="652" cy="402" r="18" fill="#60a5fa" stroke="#0f2c57" stroke-width="3"/>
    <circle cx="680" cy="402" r="18" fill="#fbbf24" stroke="#0f2c57" stroke-width="3"/>
    <text x="718" y="408" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">+12</text>
  </g>

  <!-- tag chips -->
  <g filter="url(#shadow)">
    <rect x="22" y="300" width="88" height="30" rx="15" fill="#0f2c57" stroke="#60a5fa" stroke-opacity=".6"/>
    <text x="66" y="320" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"># Kinh tế</text>
  </g>
  <g fill="#93c5fd">
    <circle cx="590" cy="40" r="3"/>
    <circle cx="40" cy="80" r="2"/>
    <circle cx="770" cy="480" r="2"/>
  </g>
</svg>
