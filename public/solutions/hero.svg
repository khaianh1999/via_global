<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
  <defs>
    <radialGradient id="halo" cx="320" cy="290" r="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#2563eb" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tech" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020a1a" flood-opacity=".55"/>
    </filter>
  </defs>

  <circle cx="320" cy="290" r="290" fill="url(#halo)"/>

  <!-- orbits -->
  <g stroke="#93c5fd">
    <circle cx="320" cy="290" r="210" stroke-opacity=".28" stroke-dasharray="4 10"/>
    <circle cx="320" cy="290" r="140" stroke-opacity=".22"/>
    <circle cx="320" cy="290" r="250" stroke-opacity=".1"/>
  </g>

  <!-- spokes -->
  <g stroke="#93c5fd" stroke-opacity=".45" stroke-width="2">
    <path d="M320 290L320 80M320 290L484 159M320 290L525 337M320 290L411 479M320 290L229 479M320 290L115 337M320 290L156 159"/>
  </g>
  <g fill="#bfdbfe">
    <circle cx="320" cy="150" r="4"/>
    <circle cx="430" cy="203" r="4"/>
    <circle cx="456" cy="321" r="4"/>
    <circle cx="380" cy="415" r="4"/>
    <circle cx="260" cy="415" r="4"/>
    <circle cx="184" cy="321" r="4"/>
    <circle cx="210" cy="203" r="4"/>
  </g>

  <!-- hub -->
  <circle cx="320" cy="290" r="86" fill="#3b82f6" opacity=".6" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <circle cx="320" cy="290" r="76" fill="url(#hub)" stroke="#dbeafe" stroke-width="3"/>
    <circle cx="320" cy="290" r="58" fill="#0b2248" fill-opacity=".3" stroke="#dbeafe" stroke-opacity=".5"/>
    <text x="320" y="304" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="2">VIA</text>
  </g>

  <!-- tiles -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- web -->
    <g transform="translate(284 44)">
      <rect width="72" height="72" rx="20" fill="url(#tech)" stroke="#bfdbfe" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <rect x="6" y="9" width="36" height="30" rx="4"/>
        <path d="M6 17h36M12 13h.01M16 13h.01M20 13h.01"/>
        <path d="M13 24h12M13 30h8M30 24h6v8h-6z"/>
      </g>
    </g>
    <!-- code -->
    <g transform="translate(448 123)">
      <rect width="72" height="72" rx="20" fill="url(#tech)" stroke="#bfdbfe" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <path d="M17 15 8 24l9 9M31 15l9 9-9 9M27 11l-6 26"/>
      </g>
    </g>
    <!-- ai -->
    <g transform="translate(489 301)">
      <rect width="72" height="72" rx="20" fill="url(#tech)" stroke="#bfdbfe" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <rect x="13" y="13" width="22" height="22" rx="4"/>
        <path d="M19 6v7M29 6v7M19 35v7M29 35v7M6 19h7M6 29h7M35 19h7M35 29h7"/>
        <path d="M20 29l4-10 4 10M21.5 25.5h5"/>
      </g>
    </g>
    <!-- flow -->
    <g transform="translate(375 443)">
      <rect width="72" height="72" rx="20" fill="url(#media)" stroke="#c7d2fe" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <rect x="6" y="8" width="13" height="10" rx="2.5"/>
        <rect x="29" y="19" width="13" height="10" rx="2.5"/>
        <rect x="6" y="30" width="13" height="10" rx="2.5"/>
        <path d="M19 13h5a5 5 0 0 1 5 5v1M19 35h5a5 5 0 0 0 5-5v-1"/>
      </g>
    </g>
    <!-- news -->
    <g transform="translate(193 443)">
      <rect width="72" height="72" rx="20" fill="url(#media)" stroke="#c7d2fe" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <path d="M10 9h24a3 3 0 0 1 3 3v27H13a3 3 0 0 1-3-3z"/>
        <path d="M37 18h4v18a3 3 0 0 1-3 3h-1"/>
        <path d="M16 16h14M16 22h14M16 28h8"/>
      </g>
    </g>
    <!-- shield -->
    <g transform="translate(79 301)">
      <rect width="72" height="72" rx="20" fill="url(#cloud)" stroke="#a5f3fc" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <path d="M24 6 39 11v11c0 9.5-6.3 16.8-15 20-8.7-3.2-15-10.5-15-20V11z"/>
        <path d="m17.5 24 4.5 4.5 8.5-9"/>
      </g>
    </g>
    <!-- cloud -->
    <g transform="translate(120 123)">
      <rect width="72" height="72" rx="20" fill="url(#cloud)" stroke="#a5f3fc" stroke-opacity=".6" stroke-width="1.5"/>
      <g transform="translate(18 18) scale(.75)">
        <path d="M15 31h18.5a7.5 7.5 0 0 0 1.2-14.9 9 9 0 0 0-17.1-2.2A6.5 6.5 0 0 0 15 31Z"/>
        <path d="M16 37h16M20 41h8M24 31v6"/>
      </g>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#dbeafe">
    <circle cx="560" cy="80" r="3"/>
    <circle cx="80" cy="470" r="3"/>
    <circle cx="590" cy="460" r="2"/>
    <circle cx="60" cy="90" r="2"/>
  </g>
  <path d="M560 210l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#bfdbfe" fill-opacity=".8"/>
  <path d="M90 240l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#bfdbfe" fill-opacity=".7"/>
</svg>
