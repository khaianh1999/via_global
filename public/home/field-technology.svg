      <stop offset="1" stop-color="#0f2c57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020a1a" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#halo)"/>
  <g stroke="#ffffff" stroke-opacity=".06">
    <path d="M0 105h800M0 210h800M0 315h800M200 0v420M400 0v420M600 0v420"/>
  </g>

