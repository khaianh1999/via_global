<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b2248"/>
    </linearGradient>
    <radialGradient id="halo" cx="520" cy="200" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd" stop-opacity=".45"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
