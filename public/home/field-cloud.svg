<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0b2248"/>
    </linearGradient>
    <radialGradient id="halo" cx="400" cy="160" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5f3fc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#164e63"/>
      <stop offset="1" stop-color="#0b2248"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020a1a" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#halo)"/>
  <g stroke="#ffffff" stroke-opacity=".06">
    <path d="M0 105h800M0 210h800M0 315h800M200 0v420M400 0v420M600 0v420"/>
  </g>

  <!-- links -->
  <g stroke="#a5f3fc" stroke-width="3" stroke-dasharray="6 8" stroke-opacity=".8">
    <path d="M400 190L170 320"/>
    <path d="M400 190L320 340"/>
    <path d="M400 190L480 340"/>
    <path d="M400 190L630 320"/>
  </g>

  <!-- cloud -->
  <g filter="url(#shadow)">
    <path d="M300 200h200a50 50 0 0 0 6-99 70 70 0 0 0-132-14 52 52 0 0 0-82 50 32 32 0 0 0 8 63z" fill="url(#cloud)"/>
    <circle cx="400" cy="150" r="30" fill="#0e7490"/>
    <path d="M370 150h60M400 120c-14 16-14 44 0 60M400 120c14 16 14 44 0 60" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- nodes -->
  <g filter="url(#shadow)">
    <rect x="120" y="300" width="100" height="70" rx="16" fill="url(#node)" stroke="#67e8f9" stroke-opacity=".6"/>
    <rect x="138" y="318" width="64" height="12" rx="4" fill="#67e8f9" fill-opacity=".5"/>
    <rect x="138" y="338" width="64" height="12" rx="4" fill="#67e8f9" fill-opacity=".5"/>
    <circle cx="192" cy="324" r="3" fill="#34d399"/>
    <circle cx="192" cy="344" r="3" fill="#34d399"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="270" y="320" width="100" height="70" rx="16" fill="url(#node)" stroke="#67e8f9" stroke-opacity=".6"/>
    <path d="M300 340v28c0 5 9 9 20 9s20-4 20-9v-28" fill="#22d3ee"/>
    <ellipse cx="320" cy="340" rx="20" ry="7" fill="#a5f3fc"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="320" width="100" height="70" rx="16" fill="url(#node)" stroke="#67e8f9" stroke-opacity=".6"/>
    <path d="M480 334l20 7v13c0 12-8 20-20 25-12-5-20-13-20-25v-13z" fill="#34d399"/>
    <path d="M471 356l6 6 12-12" stroke="#0b2248" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="580" y="300" width="100" height="70" rx="16" fill="url(#node)" stroke="#67e8f9" stroke-opacity=".6"/>
    <path d="M598 350l14-16 12 9 18-20 16 12" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- uptime chip -->
  <g filter="url(#shadow)">
    <rect x="590" y="60" width="150" height="50" rx="25" fill="#ffffff"/>
    <circle cx="616" cy="85" r="8" fill="#34d399"/>
    <text x="632" y="91" fill="#0b2248" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">99.9%</text>
  </g>
  <g fill="#cffafe">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="140" cy="200" r="2"/>
    <circle cx="740" cy="220" r="2"/>
  </g>
</svg>
