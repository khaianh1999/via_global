<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="640" cy="360" r="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1f5c"/>
      <stop offset="1" stop-color="#030b1c"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g stroke="#818cf8" stroke-opacity=".08">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280M160 0v720M320 0v720M480 0v720M640 0v720M800 0v720M960 0v720M1120 0v720"/>
  </g>

  <!-- broadcast waves -->
  <g fill="none" stroke="#a5b4fc" stroke-linecap="round" filter="url(#glow)">
    <path d="M300 360a340 340 0 0 1 100-240" stroke-width="5" opacity=".35"/>
    <path d="M980 360a340 340 0 0 0-100-240" stroke-width="5" opacity=".35"/>
    <path d="M350 360a290 290 0 0 1 80-200" stroke-width="5" opacity=".6"/>
    <path d="M930 360a290 290 0 0 0-80-200" stroke-width="5" opacity=".6"/>
  </g>

  <!-- main screen -->
  <g filter="url(#glow)">
    <rect x="420" y="170" width="440" height="280" rx="22" fill="url(#screen)" stroke="#c7d2fe" stroke-width="2.5"/>
  </g>
  <path d="M440 430l90-80 70 50 90-90 150 120Z" fill="#1e1b4b" opacity=".45"/>
  <circle cx="640" cy="300" r="52" fill="#ffffff" opacity=".95"/>
  <path d="M624 274v52l44-26Z" fill="#4338ca"/>
  <rect x="580" y="470" width="120" height="16" rx="8" fill="#6366f1"/>
  <rect x="540" y="486" width="200" height="14" rx="7" fill="#312e81"/>

  <!-- phone and social chips -->
  <g filter="url(#glow)">
    <rect x="920" y="300" width="150" height="260" rx="24" fill="#0b1240" stroke="#a5b4fc" stroke-width="2.5"/>
    <rect x="940" y="330" width="110" height="120" rx="12" fill="url(#screen)"/>
    <rect x="940" y="466" width="110" height="12" rx="6" fill="#c7d2fe"/>
    <rect x="940" y="488" width="70" height="10" rx="5" fill="#c7d2fe" opacity=".5"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="250" cy="250" r="40" fill="#f43f5e"/>
    <path d="M250 268s-22-13-22-28a12 12 0 0 1 22-6 12 12 0 0 1 22 6c0 15-22 28-22 28Z" fill="#fff"/>
    <circle cx="220" cy="470" r="40" fill="#0ea5e9"/>
    <path d="M204 470h32M220 454v32" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <rect x="300" y="540" width="200" height="56" rx="28" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/>
    <circle cx="330" cy="568" r="12" fill="#fbbf24"/>
    <rect x="352" y="562" width="120" height="12" rx="6" fill="#c7d2fe"/>
  </g>
</svg>
