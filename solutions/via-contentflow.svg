    <circle cx="762" cy="378" r="6" fill="#ffffff"/>
    <circle cx="762" cy="402" r="6" fill="#ffffff"/>
    <path d="M738 390l24-12M738 390l24 12" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- schedule chip -->
  <g filter="url(#shadow)">
    <rect x="300" y="400" width="200" height="46" rx="23" fill="#0f2c57" fill-opacity=".95" stroke="#60a5fa" stroke-opacity=".6"/>
    <rect x="318" y="412" width="22" height="22" rx="5" stroke="#93c5fd" stroke-width="2.5"/>
    <path d="M318 419h22M324 408v6M334 408v6" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
    <text x="352" y="428" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">08:00 · Auto publish</text>
  </g>

  <g fill="#93c5fd">
    <circle cx="300" cy="70" r="3"/>
    <circle cx="560" cy="440" r="2"/>
    <circle cx="640" cy="80" r="2"/>
  </g>
