<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0b2248"/>
    </linearGradient>
    <radialGradient id="halo" cx="380" cy="200" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7d2fe" stop-opacity=".4"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="video" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fdba74"/>
      <stop offset=".55" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020a1a" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#halo)"/>
  <g stroke="#ffffff" stroke-opacity=".06">
    <path d="M0 105h800M0 210h800M0 315h800M200 0v420M400 0v420M600 0v420"/>
  </g>

  <!-- video player -->
  <g filter="url(#shadow)">
    <rect x="110" y="70" width="400" height="260" rx="20" fill="#0b2248" stroke="#c7d2fe" stroke-opacity=".5"/>
    <rect x="126" y="86" width="368" height="190" rx="12" fill="url(#video)"/>
    <circle cx="440" cy="120" r="16" fill="#fef3c7"/>
    <path d="M126 262l80-60 56 40 50-34 80 54 62-40 40 30v4a12 12 0 0 1-12 12H138a12 12 0 0 1-12-12z" fill="#1e1b4b" fill-opacity=".7"/>
    <circle cx="310" cy="181" r="32" fill="#ffffff" fill-opacity=".9"/>
    <path d="M300 165v32l26-16z" fill="#4338ca"/>
    <rect x="126" y="294" width="368" height="6" rx="3" fill="#ffffff" fill-opacity=".2"/>
    <rect x="126" y="294" width="210" height="6" rx="3" fill="#f472b6"/>
    <circle cx="336" cy="297" r="8" fill="#ffffff"/>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="550" y="90" width="150" height="280" rx="26" fill="#0b2248" stroke="#c7d2fe" stroke-opacity=".6" stroke-width="2"/>
    <rect x="562" y="104" width="126" height="252" rx="16" fill="#f8fafc"/>
    <circle cx="582" cy="126" r="10" fill="#818cf8"/>
    <rect x="598" y="121" width="60" height="6" rx="3" fill="#0f172a"/>
    <rect x="572" y="146" width="106" height="90" rx="10" fill="url(#video)"/>
    <rect x="572" y="246" width="96" height="6" rx="3" fill="#0f172a"/>
    <rect x="572" y="258" width="80" height="6" rx="3" fill="#94a3b8"/>
    <path d="M580 290c-4-6 4-10 8-4 4-6 12-2 8 4l-8 8z" fill="#ef4444"/>
    <rect x="602" y="286" width="22" height="6" rx="3" fill="#94a3b8"/>
    <rect x="636" y="284" width="16" height="12" rx="4" stroke="#64748b" stroke-width="2"/>
    <rect x="572" y="312" width="106" height="30" rx="10" fill="#4338ca"/>
  </g>

  <!-- social bubbles -->
  <g filter="url(#shadow)">
    <circle cx="80" cy="120" r="34" fill="#ef4444"/>
    <path d="M70 104c-6-8 6-14 10-6 4-8 16-2 10 6l-10 12z" fill="#ffffff" transform="translate(0 6)"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="90" cy="300" r="34" fill="#0ea5e9"/>
    <circle cx="80" cy="300" r="5" fill="#ffffff"/>
    <circle cx="100" cy="290" r="5" fill="#ffffff"/>
    <circle cx="100" cy="310" r="5" fill="#ffffff"/>
    <path d="M80 300l20-10M80 300l20 10" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="740" cy="150" r="34" fill="#fbbf24"/>
    <rect x="724" y="138" width="32" height="22" rx="8" fill="#ffffff"/>
    <path d="M732 160l-4 8 10-8z" fill="#ffffff"/>
  </g>
  <g fill="#e0e7ff">
    <circle cx="740" cy="360" r="3"/>
    <circle cx="560" cy="40" r="2"/>
    <circle cx="40" cy="380" r="2"/>
  </g>
</svg>
