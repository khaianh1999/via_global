<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b72"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="400" cy="230" r="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e4a8a" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0f2c57" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020a1a" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 120h800M0 240h800M0 360h800M0 480h800M160 0v600M320 0v600M480 0v600M640 0v600"/>
  </g>

  <!-- roadmap board -->
  <g filter="url(#shadow)">
    <rect x="110" y="60" width="580" height="300" rx="22" fill="url(#glass)" stroke="#93c5fd" stroke-opacity=".45"/>
    <rect x="140" y="88" width="150" height="12" rx="6" fill="#ffffff" fill-opacity=".9"/>
    <rect x="140" y="110" width="220" height="7" rx="3.5" fill="#bfdbfe" fill-opacity=".45"/>
    <rect x="590" y="86" width="72" height="24" rx="12" fill="#34d399" fill-opacity=".2"/>
    <circle cx="606" cy="98" r="5" fill="#34d399"/>
    <rect x="616" y="95" width="36" height="6" rx="3" fill="#a7f3d0"/>

    <!-- timeline -->
    <path d="M160 210h480" stroke="#93c5fd" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 210h300" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <g>
      <circle cx="170" cy="210" r="16" fill="#34d399"/>
      <path d="M163 210l5 5 9-9" stroke="#0b2248" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="315" cy="210" r="16" fill="#34d399"/>
      <path d="M308 210l5 5 9-9" stroke="#0b2248" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="460" cy="210" r="18" fill="#3b82f6" stroke="#bfdbfe" stroke-width="3"/>
      <circle cx="460" cy="210" r="6" fill="#ffffff"/>
      <circle cx="605" cy="210" r="16" fill="#0f2c57" stroke="#93c5fd" stroke-opacity=".6" stroke-width="3"/>
    </g>
    <g fill="#ffffff" fill-opacity=".85">
      <rect x="140" y="242" width="62" height="7" rx="3.5"/>
      <rect x="285" y="242" width="62" height="7" rx="3.5"/>
      <rect x="428" y="242" width="66" height="7" rx="3.5"/>
      <rect x="574" y="242" width="62" height="7" rx="3.5" fill-opacity=".4"/>
    </g>
    <g fill="#bfdbfe" fill-opacity=".35">
      <rect x="146" y="256" width="50" height="5" rx="2.5"/>
      <rect x="291" y="256" width="50" height="5" rx="2.5"/>
      <rect x="436" y="256" width="50" height="5" rx="2.5"/>
      <rect x="580" y="256" width="50" height="5" rx="2.5"/>
    </g>
    <!-- sticky notes -->
    <rect x="140" y="290" width="100" height="44" rx="8" fill="#fde68a"/>
    <rect x="152" y="302" width="70" height="5" rx="2.5" fill="#92400e" fill-opacity=".5"/>
    <rect x="152" y="314" width="50" height="5" rx="2.5" fill="#92400e" fill-opacity=".5"/>
    <rect x="254" y="290" width="100" height="44" rx="8" fill="#bfdbfe"/>
    <rect x="266" y="302" width="70" height="5" rx="2.5" fill="#1e3a8a" fill-opacity=".5"/>
    <rect x="266" y="314" width="56" height="5" rx="2.5" fill="#1e3a8a" fill-opacity=".5"/>
    <rect x="368" y="290" width="100" height="44" rx="8" fill="#a7f3d0"/>
    <rect x="380" y="302" width="70" height="5" rx="2.5" fill="#065f46" fill-opacity=".5"/>
    <rect x="380" y="314" width="44" height="5" rx="2.5" fill="#065f46" fill-opacity=".5"/>
  </g>

  <!-- desk -->
  <ellipse cx="400" cy="560" rx="330" ry="30" fill="#3b82f6" opacity=".3" filter="url(#glow)"/>
  <rect x="70" y="520" width="660" height="22" rx="11" fill="#1e4a8a" stroke="#60a5fa" stroke-opacity=".6"/>

  <!-- person left -->
  <g filter="url(#shadow)">
    <path d="M110 520v-50a62 62 0 0 1 124 0v50z" fill="url(#p2)"/>
    <circle cx="172" cy="384" r="34" fill="#fcd9b8"/>
    <path d="M138 380a34 34 0 0 1 68 0c-10-12-22-16-34-16s-24 4-34 16z" fill="#1e1b4b"/>
  </g>
  <!-- person center (presenting) -->
  <g filter="url(#shadow)">
    <path d="M330 520v-60a70 70 0 0 1 140 0v60z" fill="url(#p1)"/>
    <circle cx="400" cy="362" r="38" fill="#f1c39b"/>
    <path d="M362 356a38 38 0 0 1 76 0c-8-18-22-24-38-24s-30 6-38 24z" fill="#0f172a"/>
    <path d="M454 430l52-74" stroke="#f1c39b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="510" cy="350" r="9" fill="#f1c39b"/>
  </g>
  <!-- person right -->
  <g filter="url(#shadow)">
    <path d="M566 520v-50a62 62 0 0 1 124 0v50z" fill="url(#p3)"/>
    <circle cx="628" cy="384" r="34" fill="#e0a77d"/>
    <path d="M594 384a34 34 0 0 1 68 0c0-22-14-34-34-34s-34 12-34 34z" fill="#3f2a1d"/>
  </g>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <path d="M226 520l14-56h100l14 56z" fill="#cbd5e1"/>
    <path d="M244 470h92l-10 42h-72z" fill="#0b2248"/>
    <rect x="254" y="480" width="40" height="5" rx="2.5" fill="#60a5fa"/>
    <rect x="254" y="491" width="58" height="5" rx="2.5" fill="#93c5fd" fill-opacity=".5"/>
  </g>
  <!-- mug -->
  <g filter="url(#shadow)">
    <rect x="500" y="488" width="30" height="32" rx="6" fill="#f8fafc"/>
    <path d="M530 496h6a8 8 0 0 1 0 16h-6" stroke="#f8fafc" stroke-width="4"/>
    <path d="M510 478c-4-6 4-8 0-14M520 478c-4-6 4-8 0-14" stroke="#bfdbfe" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- speech bubbles -->
  <g filter="url(#shadow)">
    <rect x="44" y="270" width="96" height="56" rx="18" fill="#ffffff"/>
    <path d="M100 326l14 14v-14z" fill="#ffffff"/>
    <circle cx="72" cy="298" r="6" fill="#3b82f6"/>
    <circle cx="92" cy="298" r="6" fill="#3b82f6" fill-opacity=".6"/>
    <circle cx="112" cy="298" r="6" fill="#3b82f6" fill-opacity=".3"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="676" y="272" width="84" height="56" rx="18" fill="#34d399"/>
    <path d="M690 328l-6 14 18-14z" fill="#34d399"/>
    <path d="M703 300l10 10 20-20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#bfdbfe">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="740" cy="120" r="3"/>
    <circle cx="740" cy="440" r="2"/>
    <circle cx="40" cy="460" r="2"/>
  </g>
</svg>
