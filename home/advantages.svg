<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f3466"/>
      <stop offset="1" stop-color="#071631"/>
    </linearGradient>
    <radialGradient id="halo" cx="420" cy="320" r="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e4a8a"/>
      <stop offset="1" stop-color="#0f2c57"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020a1a" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#halo)"/>
  <g stroke="#93c5fd" stroke-opacity=".07">
    <path d="M0 120h800M0 240h800M0 360h800M0 480h800M160 0v600M320 0v600M480 0v600M640 0v600"/>
  </g>

  <!-- platform -->
  <ellipse cx="400" cy="508" rx="300" ry="34" fill="#3b82f6" opacity=".4" filter="url(#glow)"/>
  <path d="M120 488h560l-30 40H150z" fill="#123b72" stroke="#60a5fa" stroke-opacity=".7"/>
  <rect x="110" y="476" width="580" height="16" rx="8" fill="#1e4a8a" stroke="#93c5fd" stroke-opacity=".7"/>

  <!-- bars -->
  <g filter="url(#shadow)">
    <rect x="180" y="380" width="72" height="96" rx="12" fill="url(#bar)"/>
    <rect x="290" y="310" width="72" height="166" rx="12" fill="url(#bar)"/>
    <rect x="400" y="240" width="72" height="236" rx="12" fill="url(#bar)"/>
    <rect x="510" y="160" width="72" height="316" rx="12" fill="url(#barTop)"/>
  </g>
  <g fill="#ffffff" fill-opacity=".25">
    <rect x="192" y="392" width="10" height="70" rx="5"/>
    <rect x="302" y="322" width="10" height="140" rx="5"/>
    <rect x="412" y="252" width="10" height="210" rx="5"/>
    <rect x="522" y="172" width="10" height="290" rx="5"/>
  </g>

  <!-- growth arrow -->
  <path d="M150 400C260 380 330 300 420 230S560 120 640 92" stroke="url(#arrow)" stroke-width="10" stroke-linecap="round"/>
  <path d="M612 78l48 6-24 42z" fill="#34d399"/>
  <g fill="#ffffff">
    <circle cx="216" cy="378" r="8"/>
    <circle cx="326" cy="310" r="8"/>
    <circle cx="436" cy="220" r="8"/>
  </g>

  <!-- badge: check -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="96" height="96" rx="26" fill="url(#tile)" stroke="#60a5fa" stroke-opacity=".6"/>
    <path d="M118 172l26 9v18c0 16-11 27-26 33-15-6-26-17-26-33v-18z" fill="#3b82f6"/>
    <path d="M106 202l8 8 16-16" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- badge: gear -->
  <g filter="url(#shadow)">
    <rect x="200" y="70" width="84" height="84" rx="24" fill="url(#tile)" stroke="#60a5fa" stroke-opacity=".6"/>
    <circle cx="242" cy="112" r="12" stroke="#fbbf24" stroke-width="6"/>
    <path d="M242 86v8M242 130v8M216 112h8M260 112h8M224 94l6 6M254 124l6 6M224 130l6-6M254 100l6-6" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- badge: link -->
  <g filter="url(#shadow)">
    <rect x="660" y="200" width="88" height="88" rx="24" fill="url(#tile)" stroke="#60a5fa" stroke-opacity=".6"/>
    <rect x="678" y="236" width="30" height="18" rx="9" stroke="#93c5fd" stroke-width="6" transform="rotate(-35 693 245)"/>
    <rect x="700" y="232" width="30" height="18" rx="9" stroke="#93c5fd" stroke-width="6" transform="rotate(-35 715 241)"/>
  </g>
  <!-- badge: partnership -->
  <g filter="url(#shadow)">
    <rect x="640" y="340" width="96" height="96" rx="26" fill="url(#tile)" stroke="#60a5fa" stroke-opacity=".6"/>
    <circle cx="676" cy="388" r="20" fill="#60a5fa" fill-opacity=".85"/>
    <circle cx="700" cy="388" r="20" fill="#34d399" fill-opacity=".85"/>
  </g>

  <!-- KPI chip -->
  <g filter="url(#shadow)">
    <rect x="330" y="80" width="190" height="58" rx="29" fill="#ffffff"/>
    <circle cx="360" cy="109" r="18" fill="#34d399" fill-opacity=".2"/>
    <path d="M350 116l8-10 6 5 10-12" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="388" y="98" width="100" height="9" rx="4.5" fill="#0f2c57"/>
    <rect x="388" y="113" width="70" height="7" rx="3.5" fill="#94a3b8"/>
  </g>

  <g fill="#bfdbfe">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="760" cy="80" r="3"/>
    <circle cx="60" cy="380" r="2"/>
    <circle cx="760" cy="520" r="2"/>
  </g>
</svg>
